# The Finder's cloud watcher: Telegram alerts while the Mac is off (NBB triggers, news reminders, market-moving headlines).
# Turn it on: Settings → Secrets and variables → Actions: secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, variable CLOUD_WATCH = on.
name: Cloud watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: cloud-watch
  cancel-in-progress: false
jobs:
  watch:
    if: vars.CLOUD_WATCH == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore what was already sent
        uses: actions/cache/restore@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Watch
        run: node cloud/watch.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Remember what was sent
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
